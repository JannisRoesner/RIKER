version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: riker:local
    container_name: riker
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
    volumes:
      - riker-data:/app/data
      - riker-prints:/app/prints
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/menu', (r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\" "]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  riker-data:
  riker-prints: